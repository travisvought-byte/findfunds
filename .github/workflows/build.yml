name: Build and check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: pip install qrcode==8.2
      - name: Build the site
        run: python3 scripts/build.py
      - name: Committed pages match the data
        run: git diff --exit-code -- docs
      - name: Check data and pages
        run: python3 scripts/check.py
      - name: Tell search engines about new pages (IndexNow)
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        continue-on-error: true
        run: |
          base="https://travisvought-byte.github.io/findfunds"
          key=$(cd scripts && python3 -c "from ffconfig import INDEXNOW_KEY; print(INDEXNOW_KEY)")
          if ! curl -fsS -o /dev/null "$base/$key.txt"; then echo "Site not live yet; skipping IndexNow."; exit 0; fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then sed "s#^$base/##" docs/urls.txt > changed.txt; else
          git diff --name-only HEAD~1 HEAD -- docs | grep 'index.html$' | sed -e 's#^docs/##' -e 's#index.html$##' | head -10000 > changed.txt || true; fi
          if [ ! -s changed.txt ]; then echo "No changed pages."; exit 0; fi
          python3 scripts/indexnow.py changed.txt
